<style>
:root{color-scheme:light;--bg:#f2f5f7;--ink:#17212b;--mute:#566370;--line:#dbe3e8;--acc:#1f7a57;--accbg:#e9f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,"Helvetica Neue",Arial,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 16px 32px}
button{font:inherit;cursor:pointer}
.sm{font-size:13px;color:var(--mute);font-weight:600}
h1{margin:2px 0 0;font-size:28px;line-height:1.15;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 4px}
h3{font-size:13px;color:var(--acc);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc)}
.days{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px}
.days button{flex:0 0 52px;height:56px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:12px;line-height:1.3}
.days button b{font-size:16px}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.days button.done{border-color:var(--acc)}
.card{display:flex;gap:12px;align-items:center;margin-top:10px;padding:12px 14px;background:#fff;border-radius:16px;border:2px solid transparent}
.card.next{border-color:var(--acc)}
.card.ok{background:var(--accbg)}
.card .t{font-size:12px;font-weight:700;color:var(--mute)}
.card.next .t,.card.ok .t{color:var(--acc)}
.card .x{font-size:14px;line-height:1.45}
.chk{flex:0 0 44px;width:44px;height:44px;border-radius:22px;border:2px solid #aab6bf;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.card.next .chk{border-color:var(--acc)}
.card.ok .chk{background:var(--acc);border-color:var(--acc)}
.note{margin-top:12px;padding:12px 14px;border-radius:16px;background:#fff7e6;border:1px solid #f0d9a8;font-size:14px}
.blk{margin-top:10px;padding:12px 14px;background:#fff;border-radius:16px;font-size:14px}
.blk.cur{border:2px solid var(--acc)}
.blk b{display:block;margin-bottom:4px}
.it{display:flex;align-items:center;gap:12px;min-height:44px;background:#fff;padding:0 14px;border-bottom:1px solid var(--line)}
.it input{width:22px;height:22px;accent-color:var(--acc)}
.it.on span{text-decoration:line-through;color:var(--mute)}
a{color:var(--acc)}.dish{display:inline-block;margin:6px 6px 0 0;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--accbg);color:var(--ink);font-size:14px}.rc{padding-left:22px}.rc li{margin:10px 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:#fff;border-bottom:1px solid var(--line)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:6}
nav button{flex:1;height:52px;border:0;background:transparent;color:var(--mute);font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--acc);font-weight:700;border-bottom-color:var(--acc)}
</style>

schi:["Щи","Говядина 390 г, капуста 450 г, картофель 300 г, морковь 120 г, сметана 45 г, вода 1,5 л, соль, лавровый лист",["Говядину сварить, как для борща (1–1,5 часа), снять пену.","Добавить картофель, через 10 минут капусту и морковь.","Варить 15 минут, посолить, добавить лавровый лист.","Мясо нарезать, вернуть в суп. Сметану добавлять в порцию."]],
chsoup:["Куриный суп с вермишелью","Куриная грудка 390 г, картофель 360 г, морковь 120 г, вермишель 90 г, вода 1,5 л, соль, лавровый лист",["Грудку залить холодной водой, довести до кипения, снять пену, варить 25 минут.","Мясо достать, нарезать.","В бульон добавить картофель, через 10 минут морковь, варить ещё 10 минут.","Вернуть мясо, посолить.","Вермишель отварить отдельно 5–6 минут и класть в тарелку при подаче: так она не раскиснет."]],
rassol:["Рассольник","Индейка 390 г, перловая крупа 90 г, картофель 300 г, морковь 120 г, лук 90 г, солёные огурцы бочковые 180 г, огуречный рассол 100 мл, вода 1,5 л, лавровый лист",["Перловку замочить на 3 часа, отварить 30–40 минут до полумягкости.","Индейку варить 35 минут, снять пену, мясо нарезать.","В бульон добавить картофель и перловку, варить 10 минут.","Лук и морковь потушить 5 минут с тремя ложками воды.","Огурцы нарезать соломкой, потушить 5–7 минут.","Всё добавить в суп вместе с рассолом и мясом, варить 10 минут."]],
ukha:["Уха","Минтай 510 г, картофель 450 г, морковь 120 г, лук 90 г, рис 60 г, вода 1,5 л, лавровый лист, перец горошком, зелень",["В воду положить половину лука целиком, морковь, лавровый лист и перец, варить 15 минут.","Добавить картофель, через 10 минут промытый рис, варить 10 минут.","Положить рыбу крупными кусками, варить 7–10 минут.","Остальной лук мелко нарезать, добавить с зеленью, настоять 10 минут.","Хранить до 2 суток; третью порцию заморозить."]],
plov:["Плов","Говядина 600 г, длиннозёрный рис 330 г, морковь 300 г, лук 150 г, масло 30 г, зира, паприка, барбарис, соль, вода около 600 мл",["Рис промыть 5–6 раз, замочить в тёплой воде на 30 минут.","Мясо нарезать кубиками по 3 см, обжарить на масле 10 минут до корочки.","Добавить лук (5 минут), затем морковь соломкой (7 минут).","Влить 100 мл воды, тушить 30 минут, добавить соль и специи.","Залить кипятком на 1 см выше мяса, варить 10 минут.","Выложить рис ровным слоем, залить кипятком на 1,5 см выше риса, варить на сильном огне до выпаривания воды.","Убавить огонь, накрыть, томить 20 минут, настоять 10 и перемешать."]],
